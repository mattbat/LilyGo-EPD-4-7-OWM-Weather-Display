[platformio]
default_envs = t5-47

; Real firmware for the LilyGo T5 4.7" (ESP32-WROVER-E, 16 MB flash, 8 MB PSRAM)
[env:t5-47]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_upload.flash_size = 16MB
board_build.partitions = partitions_16MB.csv
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
build_src_filter =
    +<*>
    -<../tools/native/>
lib_deps =
    https://github.com/Xinyuan-LilyGO/LilyGo-EPD47.git#50224221fb81a8fcf9068532374b775af84a38d4
    bblanchon/ArduinoJson@^7

; PC build: renders screens to PNG and runs unit tests. Only portable modules.
[env:native]
platform = native
build_flags = -std=gnu++17 -Iinclude -Isrc
lib_deps =
    bblanchon/ArduinoJson@^7
test_framework = unity
test_build_src = yes
build_src_filter =
    -<*>
    +<schedule.cpp>
    +<helpers.cpp>
    +<parse.cpp>
    +<units.cpp>
    +<gfx.cpp>
    +<fonts/fonts.cpp>
    +<icons.cpp>
    +<charts.cpp>
    +<alert.cpp>
    +<screens.cpp>
    +<../tools/native/main_native.cpp>
