name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install platformio

      - name: Use placeholder secrets (CI never needs real ones)
        run: cp include/secrets.example.h include/secrets.h

      - name: Unit tests (native)
        run: pio test -e native

      - name: Build native preview
        run: pio run -e native

      - name: Render screen previews
        run: |
          mkdir -p out
          .pio/build/native/program || true
          ls -la out

      - name: Upload screen previews
        uses: actions/upload-artifact@v4
        with:
          name: screen-previews
          path: out/
          if-no-files-found: ignore

      - name: Build firmware (t5-47)
        run: pio run -e t5-47

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: .pio/build/t5-47/firmware.bin
          if-no-files-found: error
